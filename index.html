<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PyQuest — Aprenda Python</title>
<style>
:root{color-scheme:dark;--tx:#eceaf7;--mu:#8f8aa8;--bd:#ffffff14;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,sans-serif;background:radial-gradient(600px 420px at 100% 0,#4a22c055,transparent 70%),radial-gradient(520px 420px at 100% 62%,#c2570c3d,transparent 70%),#05030a;background-attachment:fixed;min-height:100vh}
small{color:var(--mu)}
h2{margin:0;font-size:1.35rem;font-weight:600}
h3{margin:0 0 4px;font-size:1.02rem;font-weight:600}
.sb{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:54px;background:linear-gradient(160deg,#ffffff0c,#ffffff04);border:1px solid var(--bd);border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;backdrop-filter:blur(12px);z-index:5}
.sb button{width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:#8f8aa8;display:grid;place-items:center;cursor:pointer}
.sb button.on{background:#7c5cff30;color:#b9a6ff;box-shadow:0 0 14px #7c5cff55}
.sb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sb .lg{margin-top:auto;font-size:.62rem;color:var(--mu);writing-mode:vertical-rl;letter-spacing:1px}
main{margin-left:72px;padding:12px 12px 24px 6px;max-width:700px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin:4px 0 12px}
.top small{text-transform:capitalize}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chips span{background:#ffffff0d;border:1px solid var(--bd);border-radius:20px;padding:3px 10px;font-size:.8rem}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.w2{grid-column:span 2}
.c{background:linear-gradient(145deg,#ffffff0d,#ffffff04);border:1px solid var(--bd);border-radius:18px;padding:14px;backdrop-filter:blur(10px);min-width:0}
.mb{margin-bottom:10px}
.pill{float:right;background:#ffffff10;border-radius:10px;padding:3px 9px;font-size:.8rem}
.hello{font-size:1.5rem;font-weight:600;margin:10px 0 2px}
.sp{width:100%;height:64px;display:block;margin-top:8px}
.num{font-size:2.3rem;font-weight:600;line-height:1.1;margin:6px 0}
.num span{font-size:1rem;color:var(--mu)}
.dots{display:flex;gap:5px;margin-top:8px}
.dots i{flex:1;height:8px;border-radius:4px;background:#ffffff14}
.dots i.on{background:linear-gradient(90deg,#60a5fa,#a855f7)}
.bar{height:6px;background:#ffffff14;border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#a855f7);transition:width .3s}
.ae{display:flex;align-items:center;gap:14px}
.ae p{margin:3px 0;font-size:.92rem}
.stk{display:flex;height:8px;border-radius:6px;overflow:hidden;background:#ffffff12;margin-top:12px}
.stk i{background:linear-gradient(90deg,#60a5fa,#8b5cf6)}
.stk b{background:linear-gradient(90deg,#fb923c,#f59e0b)}
.wr{display:grid;grid-template-columns:84px 1fr auto;gap:8px;align-items:center;margin:8px 0}
.wr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr2{height:8px;background:#ffffff10;border-radius:8px;overflow:hidden}
.tr2 i{display:block;height:100%;background:linear-gradient(90deg,#fb923c,#f59e0b);border-radius:8px}
.tr2.g i{background:linear-gradient(90deg,#60a5fa,#8b5cf6)}
.wb{display:flex;gap:6px;height:130px;margin-top:8px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;gap:3px}
.col .v{font-size:.75rem;height:14px}
.tr{flex:1;width:10px;background:#ffffff10;border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.tr i{width:100%;background:linear-gradient(#60a5fa,#8b5cf6);border-radius:8px}
button{font:inherit;color:var(--tx);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #b9a6ff;outline-offset:2px}
.btn{width:100%;background:linear-gradient(135deg,#6d4aff,#a855f7);border:0;border-radius:12px;padding:12px;font-weight:600;margin-top:12px}
.btn.sm{width:auto;padding:7px 12px;margin-top:8px;font-size:.88rem}
.btn:disabled{background:#ffffff12;color:var(--mu);cursor:default}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--bd);padding:11px 2px;margin-top:6px}
.row:first-of-type{margin-top:8px}
.row>span:nth-child(2){flex:1}
.row:disabled{opacity:.45;cursor:default}
.row em{font-style:normal;font-size:.8rem;color:var(--mu)}
.row em.s2{color:#fbbf24}
.ck{width:18px;height:18px;border-radius:50%;border:2px solid #ffffff30;flex:none;position:relative}
.dn .ck{background:#3b82f6;border-color:#3b82f6}
.dn .ck::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.op{display:block;width:100%;text-align:left;background:#ffffff0a;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:8px}
.op.ok{background:#12351f;border-color:#34d399}
.op.bad{background:#3a1220;border-color:#fb7185}
input{width:100%;background:#ffffff0a;border:1px solid var(--bd);border-radius:12px;padding:12px;color:var(--tx);font:inherit;margin-top:8px}
.code{background:#030108;border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0;overflow-x:auto;font:13.5px/1.5 ui-monospace,Menlo,Consolas,monospace;min-height:80px;white-space:pre}
.cur::after{content:"▍";animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.fx0{color:#c4b5fd}
.fx1{color:#39ff14;text-shadow:0 0 8px #39ff14}
.fx2{color:#ff9a3c;text-shadow:0 0 8px #ff4500}
.fx3{color:#7df9ff;text-shadow:0 0 8px #00bfff}
.fx5{color:#fbbf24;text-shadow:0 0 8px #b45309}
.fx4,.fx6{-webkit-background-clip:text;background-clip:text;color:transparent;background-size:300%;animation:rb 3s linear infinite}
.fx4{background-image:linear-gradient(90deg,#f0f,#0ff,#ff0,#f0f)}
.fx6{background-image:linear-gradient(90deg,#8b5cf6,#38bdf8,#f472b6,#8b5cf6)}
@keyframes rb{to{background-position:300% 0}}
.fb{margin-top:10px;padding:10px;border-radius:12px;background:#ffffff0a;border:1px solid var(--bd)}
.it{text-align:center}
.ex h4{margin:16px 0 4px;color:#b9a6ff;font-size:.95rem}.ex p{margin:4px 0}.ex ul{padding-left:18px;margin:4px 0}.ex li{margin:3px 0}.ex .code{min-height:0}
textarea{width:100%;background:#030108;border:1px solid var(--bd);border-radius:12px;color:#c4b5fd;font:13.5px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:10px;margin:6px 0;tab-size:4;resize:vertical}
#ed{height:220px}
.term pre{margin:6px 0 0;color:#a7f3d0;font:13.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;min-height:80px;word-break:break-word}
.it .code{min-height:0;padding:8px;text-align:left}
.it.eq{border-color:#a78bfa;box-shadow:0 0 14px #7c5cff44}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2b1a4d;border:1px solid #a78bfa;padding:8px 14px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

`<h4>O que é um programa</h4><p>Um programa é uma lista de instruções que o computador executa de cima para baixo, uma linha por vez. A instrução mais básica é print(): ela escreve na tela o que estiver entre os parênteses.</p><h4>Texto, números e contas</h4><p>Texto precisa de aspas simples ou duplas. Números não levam aspas e podem entrar em contas. Vários itens separados por vírgula saem com um espaço entre eles.</p><pre class="code §">print("Idade:", 15)   # Idade: 15
print("Ha" * 3)       # HaHaHa
print(10 - 4)         # 6</pre><h4>Comentários</h4><p>Tudo depois de # é ignorado pelo Python. Use para explicar o que o código faz e para desativar uma linha temporariamente.</p><h4>Erros comuns</h4><ul><li>Esquecer as aspas: print(Olá) dá NameError.</li><li>Não fechar o parêntese ou as aspas.</li><li>Escrever Print com P maiúsculo: o Python diferencia maiúsculas de minúsculas.</li></ul>`,
`<h4>O que é uma variável</h4><p>É um nome que guarda um valor na memória, como uma caixa etiquetada. Você cria com <b>nome = valor</b> e usa o nome sempre que quiser o valor de volta.</p><h4>Regras para nomes</h4><ul><li>Pode ter letras, números e _, mas não pode começar com número.</li><li>Sem espaços nem hífen: use meu_nome.</li><li>Maiúscula importa: nota e Nota são variáveis diferentes.</li><li>Não use palavras reservadas como if, for e class.</li></ul><h4>Os quatro tipos básicos</h4><p><b>int</b> (inteiro: 7), <b>float</b> (decimal: 7.5), <b>str</b> (texto: "7") e <b>bool</b> (True ou False). Converta com int(), float() e str().</p><pre class="code §">x = 10
x = x + 5       # agora x vale 15
a = "3"
print(int(a) + 1)  # 4</pre><h4>Erros comuns</h4><ul><li>Confundir = (guardar valor) com == (comparar).</li><li>Usar uma variável antes de criá-la.</li><li>Achar que "3" e 3 são a mesma coisa: um é texto, o outro é número.</li></ul>`,
`<h4>Lendo dados do teclado</h4><p>input("mensagem") pausa o programa e espera a pessoa digitar. O resultado é sempre texto (str), mesmo que digite 42. Para fazer contas, converta com int() ou float().</p><h4>Operadores matemáticos</h4><ul><li><b>+ - *</b> somam, subtraem e multiplicam.</li><li><b>/</b> divide e sempre devolve float (7 / 2 = 3.5).</li><li><b>//</b> divisão inteira (7 // 2 = 3).</li><li><b>%</b> resto da divisão (7 % 2 = 1), ótimo para saber se um número é par.</li><li><b>**</b> potência (2 ** 3 = 8).</li></ul><p>A ordem é a da matemática: primeiro **, depois * / // %, por fim + e -. Parênteses mandam em tudo.</p><pre class="code §">nome = input("Nome: ")
ano = int(input("Ano de nascimento: "))
print(f"Olá, {nome}! Você tem {2026 - ano} anos.")</pre><p>O f antes das aspas é uma f-string: o que está entre chaves é calculado e colocado no texto.</p><h4>Erros comuns</h4><ul><li>Somar texto com número: "5" + 2 dá TypeError.</li><li>Esquecer o int() e tentar fazer conta com o resultado do input.</li></ul>`,
`<h4>Fazendo o programa decidir</h4><p>O if testa uma condição. Se for verdadeira, o bloco indentado roda. Se não, o Python tenta o elif seguinte e, por fim, o else. Apenas um bloco da cadeia é executado.</p><h4>Comparações e lógica</h4><ul><li><b>== != &lt; &gt; &lt;= &gt;=</b> comparam e devolvem True ou False.</li><li><b>and</b>: os dois precisam ser verdadeiros. <b>or</b>: basta um. <b>not</b> inverte.</li></ul><pre class="code §">nota = 7
if nota &gt;= 7 and nota &lt;= 10:
    print("Aprovado")
elif nota &gt;= 5:
    print("Recuperação")
else:
    print("Reprovado")</pre><h4>Regras do bloco</h4><p>A linha do if termina com dois-pontos e o bloco abaixo usa 4 espaços de recuo. Quando o recuo termina, o bloco acaba.</p><h4>Erros comuns</h4><ul><li>Usar = no lugar de == dentro do if.</li><li>Esquecer os dois-pontos.</li><li>Recuo diferente entre linhas: IndentationError.</li><li>Colocar elif depois de else.</li></ul>`,
`<h4>Repetindo sem copiar código</h4><p>O for percorre uma sequência item por item, rodando o bloco a cada volta. A variável do for recebe o item atual.</p><h4>A função range</h4><ul><li>range(5) gera 0, 1, 2, 3, 4.</li><li>range(2, 6) gera 2, 3, 4, 5. O fim nunca entra.</li><li>range(0, 10, 3) gera 0, 3, 6, 9: o terceiro número é o passo.</li></ul><h4>Percorrendo coisas</h4><p>O for também percorre listas e textos. Um padrão muito usado é o acumulador: uma variável que cresce a cada volta.</p><pre class="code §">total = 0
for n in range(1, 5):
    total += n
print(total)   # 10
for letra in "abc":
    print(letra)</pre><h4>Erros comuns</h4><ul><li>Esperar que range(1, 5) inclua o 5.</li><li>Esquecer o dois-pontos ou o recuo.</li><li>Zerar o acumulador dentro do loop em vez de antes dele.</li></ul>`,
`<h4>Repetir enquanto for verdade</h4><p>O while testa a condição antes de cada volta e só para quando ela virar falsa. Use quando você não sabe quantas voltas serão necessárias, como pedir uma senha até acertar.</p><h4>Os três cuidados</h4><ul><li>Crie a variável de controle antes do loop.</li><li>Altere essa variável dentro do loop (n -= 1, i += 1), senão o loop é infinito.</li><li>break encerra o loop na hora; continue pula para a próxima volta.</li></ul><pre class="code §">while True:
    senha = input("Senha: ")
    if senha == "python":
        print("Acesso liberado")
        break
    print("Tente de novo")</pre><h4>for ou while?</h4><p>Se sabe o número de voltas ou tem uma coleção, use for. Se depende de uma condição, use while.</p><h4>Erros comuns</h4><ul><li>Loop infinito por esquecer de atualizar a variável.</li><li>Condição que já começa falsa: o loop nunca roda.</li></ul>`,
`<h4>Por que usar funções</h4><p>Uma função é um bloco de código com nome. Você escreve uma vez e usa quantas vezes quiser, evitando repetição e deixando o programa organizado.</p><h4>Como criar e chamar</h4><p>Defina com <b>def nome():</b> e coloque o corpo recuado. A função só executa quando você a chama com parênteses.</p><pre class="code §">def area(lado):
    return lado * lado

resultado = area(4)
print(resultado)   # 16</pre><h4>return x print</h4><ul><li><b>print</b> só mostra algo na tela.</li><li><b>return</b> devolve o valor para quem chamou, e você pode guardar ou usar em contas.</li><li>Depois do return a função termina. Sem return ela devolve None.</li></ul><h4>Erros comuns</h4><ul><li>Definir a função e esquecer de chamá-la.</li><li>Usar print quando precisava de return.</li><li>Esquecer os dois-pontos ou o recuo.</li></ul>`,
`<h4>Parâmetros e argumentos</h4><p>Parâmetro é o nome na definição (def f(x)). Argumento é o valor passado na chamada (f(5)). A ordem importa, a não ser que você use o nome: f(b=1, a=2).</p><h4>Valores padrão</h4><p>def f(a, b=2) usa 2 se você não passar b. Parâmetros com padrão ficam depois dos obrigatórios.</p><h4>Vários retornos</h4><p>return a, b devolve dois valores de uma vez, que você recebe assim: x, y = f().</p><h4>Escopo</h4><ul><li>Variável criada dentro da função é local: some quando ela termina.</li><li>Variável criada fora é global e pode ser lida dentro das funções.</li></ul><pre class="code §">def media(a, b=10):
    m = (a + b) / 2
    return m

print(media(6))      # 8.0
print(media(b=2, a=4)) # 3.0</pre><h4>Erros comuns</h4><ul><li>Chamar sem os argumentos obrigatórios: TypeError.</li><li>Tentar usar fora da função uma variável criada dentro dela.</li></ul>`,
`<h4>Guardando vários itens</h4><p>Lista é uma coleção ordenada e que pode ser alterada: [10, 20, 30]. Pode misturar tipos e repetir valores.</p><h4>Índices e fatias</h4><ul><li>O primeiro item é o índice 0 e o último é -1.</li><li>lista[1:3] pega do índice 1 até o 2 (o fim não entra).</li></ul><h4>Métodos principais</h4><ul><li><b>append(x)</b> adiciona no fim, <b>insert(i, x)</b> na posição i.</li><li><b>remove(x)</b> tira pelo valor, <b>pop(i)</b> tira pela posição.</li><li><b>sort()</b> ordena, <b>len(lista)</b> conta, <b>x in lista</b> verifica.</li></ul><pre class="code §">notas = [7, 9, 5]

`<h4>Dados com nome</h4><p>Dicionário guarda pares chave: valor. Em vez de lembrar a posição, você pede pela chave. Chaves são únicas e normalmente textos ou números.</p><h4>Operações</h4><ul><li>d["chave"] lê, e d["chave"] = valor cria ou altera.</li><li>d.get("chave", padrão) lê sem dar erro se faltar.</li><li>"chave" in d verifica se existe, del d["chave"] remove.</li><li>keys(), values() e items() listam chaves, valores e pares.</li></ul><pre class="code §">pessoa = {"nome": "Caio", "idade": 14}

`<h4>Moldes e objetos</h4><p>Uma classe descreve como algo é (atributos) e o que faz (métodos). Cada objeto criado a partir dela é uma cópia independente, com seus próprios dados.</p><h4>Peças da classe</h4><ul><li><b>__init__</b> roda automaticamente ao criar o objeto e prepara os atributos.</li><li><b>self</b> é o próprio objeto: self.nome guarda o dado nele.</li><li>Todo método recebe self como primeiro parâmetro.</li></ul><pre class="code §">class Gato:

`<h4>Erros não precisam derrubar o programa</h4><p>Quando algo dá errado, o Python levanta uma exceção e para tudo. Com try/except você prevê o problema e decide o que fazer.</p><h4>Estrutura completa</h4><ul><li><b>try</b>: código que pode falhar.</li><li><b>except Tipo</b>: roda se aquele erro acontecer. Pode haver vários.</li><li><b>else</b>: roda se nada falhou.</li><li><b>finally</b>: roda sempre.</li><li><b>raise</b> lança um erro de propósito.</li></ul><h4>Erros mais comuns</h4><p>ValueError (valor inválido), ZeroDivisionError, KeyError (chave faltando), IndexError (índice fora), TypeError (tipos incompatíveis).</p><pre class="code §">try:

 if(q[1]){r=ord[j]===q[2];const b=document.querySelectorAll(".op");b[j].classList.add(r?"ok":"bad");b[ord.indexOf(q[2])].classList.add("ok")}
 else{const v=$("#in").value.trim().toLowerCase().replace(/^['"]|['"]$/g,"");if(!v)return;r=v===String(q[2])}
 lock=true;if(r)ok++;
 S.st[r?"ok":"bad"]++;const k=S.kw[q[4]]=S.kw[q[4]]||[0,0];k[r?0:1]++;S.day[today()]=(S.day[today()]||0)+1;S.hist=[...S.hist,r?1:0].slice(-40);save();
 $("#fb").innerHTML=`<div class="fb"><b>${r?"Certo! +5 moedas":"Resposta: "+esc(q[1]?q[1][q[2]]:q[2])}</b><br>${esc(q[3])}</div><button class="btn" onclick="nextQ()">${qi+1>=cur.q.length?"Finalizar":"Próxima"}</button>`}
function nextQ(){qi++;if(qi>=cur.q.length)finish();else draw()}
function finish(){const f=!S.done[cur.id];cur.gc=ok*5+(f?20:0);cur.gx=ok*10+(f?20:0);S.coins+=cur.gc;S.xp+=cur.gx;S.done[cur.id]=1;
 const t=today();if(S.last!==t){S.streak=S.last===ago(1)?S.streak+1:1;S.last=t;S.days=[...S.days.filter(d=>d!==t),t].slice(-30)}
 save();view="done";draw()}
function done(){const p=Math.round(ok/cur.q.length*100);return topbar("Lição concluída")+`<div class="c" style="text-align:center"><div style="display:grid;place-items:center">${ring(p,"r2",130)}</div><h3 style="margin-top:10px">Você acertou ${ok} de ${cur.q.length}</h3><p>+${cur.gx} XP e +${cur.gc} moedas<br><small>Sequência: ${streak()} dia(s)</small></p><button class="btn" onclick="go('home')">Ver painel</button><button class="btn" style="background:#ffffff14" onclick="go('paths')">Voltar às trilhas</button></div>`}
function typeIt(el,t){let i=0;el.classList.add("cur");const end=()=>{clearInterval(typer);el.textContent=t;el.classList.remove("cur")};
 el.onclick=end;typer=setInterval(()=>{el.textContent=t.slice(0,++i);if(i>=t.length)end()},24)}
function lesson(id){cur=ALL.find(x=>x.id===id);qi=0;ok=0;view="intro";draw()}
function go(v){view=v;draw()}
function draw(){clearInterval(typer);lock=false;
 $("#app").innerHTML=({home,paths,shop,intro,quiz,done,train:trainPg,term:termPg}[view])();
 const a=view=="term"?"term":view=="home"?"home":view=="shop"?"shop":view=="train"||(["quiz","done"].includes(view)&&cur.id=="t")?"train":"paths";
 ["home","paths","train","term","shop"].forEach(n=>$("#n-"+n).classList.toggle("on",n==a));
 if(view=="intro")typeIt($("#code"),cur.c);
 window.scrollTo(0,0)}
draw();
</script>
</body>
