name: Build PyQuest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Listar arquivos na raiz (Debug)
        run: ls -la

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Conferir se o index.html existe
        run: |
          if [ ! -f index.html ]; then
            echo "::error::index.html NÃO encontrado na raiz do repositório!"
            echo "Certifique-se de que o arquivo foi enviado para o GitHub (não apenas deixado no celular)."
            exit 1
          fi
          echo "index.html encontrado com sucesso!"

      - name: Validar o JavaScript do app
        run: |
          node -e "
          const fs = require('fs');
          const h = fs.readFileSync('index.html', 'utf8');
          const m = h.match(/<script>([\s\S]*)<\/script>/);
          if (!m) throw new Error('Nenhum bloco <script> encontrado no index.html');
          new Function(m[1]);
          console.log('JavaScript sem erros de sintaxe');
          "

      - name: Montar a pasta dist e o zip
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cd dist
          
          if ! command -v zip &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y zip
          fi
          
          zip -r ../pyquest.zip .
          cd ..

      - name: Guardar o zip como artefato
        uses: actions/upload-artifact@v4
        with:
          name: pyquest-zip
          path: pyquest.zip

      - name: Preparar o site para o GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
